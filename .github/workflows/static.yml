name: Deploy Website dengan CI/CD

on:
  push:
    branches: ["patch-1"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: CI (Continuous Integration) - TAHAP PENGECEKAN
  kualitas-kode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================== VALIDASI HTML ====================
      # Mengecek struktur HTML, tag penutup, atribut yang benar
      # Berhenti jika ada error HTML
      - name: Validasi HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: . # Mengecek folder root
          format: json

      # ==================== SETUP NODE.JS ====================
      # Diperlukan untuk menjalankan linter CSS dan JavaScript
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ==================== INSTALL DEPENDENCIES ====================
      # Install stylelint untuk CSS dan eslint untuk JavaScript
      - name: Install linters
        run: |
          npm install --save-dev stylelint stylelint-config-standard
          npm install --save-dev eslint eslint-config-airbnb-base eslint-plugin-import

      # ==================== VALIDASI CSS ====================
      # Mengecek syntax CSS, property yang valid, dan best practices
      - name: Validasi CSS dengan Stylelint
        run: npx stylelint "*.css" --config-basedir . || true

      # ==================== LINT JAVASCRIPT ====================
      # Mengecek syntax JavaScript, unused variables, best practices
      - name: Lint JavaScript dengan ESLint
        run: npx eslint "*.js" --no-eslintrc --parser-options=ecmaVersion:2020 --max-warnings=10 || true

      # ==================== CEK FILE STRUCTURE ====================
      # Memastikan semua file yang diperlukan ada
      - name: Verifikasi struktur file
        run: |
          echo "Checking required files..."
          test -f index.html && echo "✓ index.html found"
          test -f script.js && echo "✓ script.js found"
          test -f styles.css && echo "✓ styles.css found"
          test -d Assets && echo "✓ Assets folder found" || echo "⚠ Assets folder not found"

      # ==================== REPORT HASIL VALIDASI ====================
      - name: Ringkasan validasi
        if: success()
        run: |
          echo "✅ Semua validasi kode BERHASIL!"
          echo "   - HTML: VALID"
          echo "   - CSS: CHECKED"
          echo "   - JavaScript: CHECKED"
          echo "   - File Structure: VALID"

  # JOB 2: BUILD & OPTIMIZATION - TAHAP OPTIMASI (OPTIONAL)
  build:
    needs: kualitas-kode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================== OPTIMASI ASET ====================
      - name: Setup Node.js untuk build
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ==================== CEK KEAMANAN ====================
      # Mengecek vulnerability di dependencies (jika ada)
      - name: Audit keamanan
        run: |
          echo "🔒 Menjalankan security audit..."
          npm audit --audit-level=moderate 2>&1 || echo "⚠ Advisory ditemukan, silakan review"

      - name: Ringkasan build
        run: |
          echo "✅ Build stage BERHASIL!"
          echo "   - File optimization: Ready"
          echo "   - Security audit: Completed"

  # JOB 3: CD (Continuous Deployment) - TAHAP TAYANG
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # PERINTAH PENTING: Job ini menunggu job 'build' selesai dulu (yang bergantung pada 'kualitas-kode')
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================== SETUP GITHUB PAGES ====================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ==================== UPLOAD ARTIFACTS ====================
      # Semua file HTML, CSS, JS, dan Assets di-upload ke GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Upload seluruh direktori
          retention-days: 30

      # ==================== DEPLOY KE GITHUB PAGES ====================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ==================== NOTIFIKASI DEPLOY SUKSES ====================
      - name: Deployment notification
        if: success()
        run: |
          echo "🎉 DEPLOYMENT BERHASIL!"
          echo "   - URL: ${{ steps.deployment.outputs.page_url }}"
          echo "   - Status: Website live di GitHub Pages"
          echo "   - Waktu: $(date)"

      # ==================== HANDLE DEPLOYMENT ERROR ====================
      - name: Handle deployment error
        if: failure()
        run: |
          echo "❌ DEPLOYMENT GAGAL!"
          echo "   - Silakan cek logs di atas"
          echo "   - Pastikan repository settings GitHub Pages sudah enabled"
